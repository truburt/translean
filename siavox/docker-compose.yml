services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siavox-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/siavox.db
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DEBUG_MODE=${DEBUG_MODE:-false}
    volumes:
      - siavox-data:/app/data
      - siavox-uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siavox-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  siavox-data:
  siavox-uploads:
