services:
  ollama:
    image: ollama/ollama:latest
    container_name: siavox-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    
  ollama-model-loader:
    image: curlimages/curl:8.10.1
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -lc
      - |
        set -e
        echo 'Waiting for Ollama...'
        until curl -fsS http://ollama:11434/api/version >/dev/null; do sleep 1; done
        echo 'Pulling gemma4:e4b...'
        curl -fsS http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{"model":"gemma4:e4b","stream":false}'
        echo -e "\nDone."